# Pages CMS config (https://pagescms.org) - lets you edit the site from a web UI.
# Sign in at pagescms.org with GitHub, pick this repo and branch, and edit.

media:
  input: mistyvillas.in/images
  output: /images

content:
  - name: site
    label: Site & contact details
    type: file
    path: mistyvillas.in/data.json
    format: json
    fields:
      - name: site
        label: Site details
        type: object
        fields:
          - { name: name, label: Business name, type: string }
          - { name: tagline, label: Homepage tagline, type: string }
          - { name: hero_image, label: Homepage banner photo, type: image }
          - { name: notice, label: Top banner message (leave empty to hide), type: string }
          - { name: phone_primary, label: Primary phone (+91...), type: string }
          - { name: phone_primary_display, label: Primary phone (how it shows), type: string }
          - { name: phone_secondary, label: Secondary phone (+91...), type: string }
          - { name: phone_secondary_display, label: Secondary phone (how it shows), type: string }
          - { name: whatsapp, label: WhatsApp number (91XXXXXXXXXX, no +), type: string }
          - { name: contact_person, label: Contact person, type: string }
          - { name: instagram_url, label: Instagram link, type: string }
          - { name: instagram_handle, label: Instagram handle, type: string }
          - { name: extra_person_charge, label: Extra person charge (Rs), type: number }
          - { name: about, label: "About text (shown on homepage; used by Google and AI tools)", type: text }
          - { name: address, label: Address line, type: string }

      - name: rooms
        label: Rooms & rates
        type: object
        list: true
        fields:
          - { name: name, label: Room name, type: string }
          - { name: old_price, label: Old (strikethrough) price, type: number }
          - { name: price, label: Current price per night, type: number }
          - { name: max_guests, label: Max guests included, type: number }
          - name: features
            label: Features
            type: string
            list: true
          - name: photos
            label: Photos
            type: object
            list: true
            fields:
              - { name: image, label: Photo, type: image }

      - name: experiences
        label: Experience sections (hilltop, food, nearby)
        type: object
        list: true
        fields:
          - { name: title, label: Title, type: string }
          - { name: text, label: Description, type: text }
          - name: photos
            label: Photos
            type: object
            list: true
            fields:
              - { name: image, label: Photo, type: image }
              - { name: alt, label: Short description of photo, type: string }

      - name: amenities
        label: Facilities list (pool, BBQ...)
        type: string
        list: true

      - name: faq
        label: Frequently asked questions (rates and booking answers are added automatically)
        type: object
        list: true
        fields:
          - { name: q, label: Question, type: string }
          - { name: a, label: Answer, type: text }

  - name: pages
    label: New pages (About, FAQ, Gallery...)
    type: collection
    path: mistyvillas.in/content/pages
    format: yaml-frontmatter
    filename: "{primary}.md"
    view:
      fields: [title, draft]
    fields:
      - { name: title, label: Page title, type: string, required: true }
      - { name: description, label: Short description for Google (1-2 sentences), type: text }
      - { name: image, label: Top banner photo (optional), type: image }
      - { name: image_alt, label: Banner photo description, type: string }
      - { name: draft, label: Draft (tick to hide from the live site), type: boolean, default: true }
      - { name: body, label: Page content, type: rich-text }

  - name: guides
    label: Travel guides / blog
    type: collection
    path: mistyvillas.in/content/guides
    format: yaml-frontmatter
    filename: "{primary}.md"
    view:
      fields: [title, date, draft]
      sort: [date]
      default:
        sort: date
        order: desc
    fields:
      - { name: title, label: Guide title, type: string, required: true }
      - { name: description, label: Short description for Google and the guides list, type: text }
      - { name: date, label: Publish date, type: date }
      - { name: image, label: Cover photo, type: image }
      - { name: image_alt, label: Cover photo description, type: string }
      - { name: draft, label: Draft (tick to hide from the live site), type: boolean, default: true }
      - name: spots
        label: Numbered spots (1, 2, 3... each with photos and text)
        type: object
        list: true
        fields:
          - { name: name, label: Spot name, type: string }
          - { name: text, label: Text (leave a blank line between paragraphs), type: text }
          - name: photos
            label: Photos (1 to 3)
            type: object
            list: true
            fields:
              - { name: image, label: Photo, type: image }
              - { name: alt, label: Short description of photo, type: string }
      - { name: resort_promo, label: Add the "Misty Villas" promo block as the last spot, type: boolean, default: true }
      - { name: reviews_title, label: Reviews section title, type: string }
      - name: reviews
        label: Reviews (Instagram videos)
        type: object
        list: true
        fields:
          - { name: link, label: Instagram video link, type: string }
          - { name: thumbnail, label: Video thumbnail (upload a screenshot/cover), type: image }
          - { name: caption, label: Caption, type: string }
      - { name: body, label: Intro or extra text (optional), type: rich-text }
